<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.App}} · URL Shortener</title>
<style>
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f1f3f9;
  --border: #e3e6ef;
  --text: #161a26;
  --muted: #646b80;
  --accent: #5b5bf0;
  --accent-2: #8b5cf6;
  --accent-soft: #ecebff;
  --danger: #d43c4f;
  --danger-soft: #fdecee;
  --success: #12936b;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 8px 24px rgba(20, 24, 40, .06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1018;
    --surface: #161925;
    --surface-2: #1d2130;
    --border: #2a2f42;
    --text: #e8eaf2;
    --muted: #9298ad;
    --accent: #8183ff;
    --accent-2: #a78bfa;
    --accent-soft: #23244a;
    --danger: #ff6b7d;
    --danger-soft: #3a1d24;
    --success: #3ccf9b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 48px 16px 64px; }
header { margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.identity { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.identity p { margin: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px;
}
.card + .card { margin-top: 20px; }
h2 { margin: 0 0 14px; font-size: 16px; }
form { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; }
@media (max-width: 640px) { form { grid-template-columns: 1fr; } }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
input {
  width: 100%; height: 44px; padding: 0 14px;
  font: inherit; color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 10px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.prefix { position: relative; }
.prefix span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.prefix input { padding-left: 26px; }
button {
  font: inherit; font-weight: 600; cursor: pointer;
  border: 0; border-radius: 10px; height: 44px; padding: 0 18px;
  transition: transform .05s, opacity .15s, background .15s;
}
button:active { transform: translateY(1px); }
button:disabled { opacity: .6; cursor: progress; }
.primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); align-self: end; }
.ghost { background: transparent; color: var(--muted); height: 32px; padding: 0 10px; font-size: 13px; }
.ghost:hover { background: var(--surface-2); color: var(--text); }
.ghost.danger:hover { background: var(--danger-soft); color: var(--danger); }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.error {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--danger-soft); color: var(--danger); font-size: 14px;
}
.result {
  margin-top: 14px; padding: 14px; border-radius: 12px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  animation: pop .25s ease-out;
}
.result a { font-weight: 700; color: var(--accent); text-decoration: none; word-break: break-all; }
.result .grow { flex: 1; min-width: 0; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.list-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.count { color: var(--muted); font-size: 13px; }
ul { list-style: none; margin: 0; padding: 0; }
li {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center;
  padding: 14px 0; border-top: 1px solid var(--border);
}
li:first-child { border-top: 0; }
.short { font-weight: 700; color: var(--text); text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
.short:hover { color: var(--accent); }
.target { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.visits {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 700; font-size: 13px; color: var(--text);
  background: var(--surface-2); border-radius: 999px; padding: 3px 10px;
}
.visits.bump { animation: bump .4s ease-out; }
@keyframes bump { 40% { background: var(--accent-soft); color: var(--accent); transform: scale(1.08); } }
.actions { display: flex; gap: 2px; grid-row: span 2; }
.left { min-width: 0; display: grid; gap: 4px; }
.empty { text-align: center; padding: 28px 0 12px; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }
footer { margin-top: 28px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      </div>
      <h1>{{.App}}</h1>
    </div>
    <div class="identity">
      <p>Calugar Miruna, group DMWD</p>
      <p>Project 1: URL Shortener with Analytics</p>
    </div>
  </header>

  <section class="card" aria-labelledby="create-title">
    <h2 id="create-title">Shorten a link</h2>
    <form id="create-form" novalidate>
      <div>
        <label for="url">Long URL</label>
        <input id="url" name="url" type="url" placeholder="https://go.dev/doc/effective_go" autocomplete="off" required>
      </div>
      <div>
        <label for="code">Custom code <span style="font-weight:400">(optional)</span></label>
        <div class="prefix"><span>/</span><input id="code" name="code" placeholder="gofmt" maxlength="10" autocomplete="off" spellcheck="false"></div>
      </div>
      <button class="primary" type="submit" id="submit">Shorten</button>
    </form>
    <p class="hint">Codes have 4 to 10 characters: letters, digits, - and _. Leave it empty to get a random 7-character code.</p>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="result" class="result" hidden>
      <div class="grow">
        <a id="result-link" target="_blank" rel="noopener"></a>
        <div class="target" id="result-target"></div>
      </div>
      <button class="ghost" type="button" id="result-copy">Copy</button>
    </div>
  </section>

  <section class="card" aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">Your links</h2>
      <span class="count" id="count"></span>
    </div>
    <ul id="links" aria-live="polite"></ul>
    <div class="empty" id="empty" hidden>
      <strong>No links yet</strong>
      Shorten your first URL above.
    </div>
  </section>

  <footer>
    <span><span class="dot" id="health-dot"></span><span id="health">checking…</span></span>
    <span id="version"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const REFRESH_MS = 5000;
  const $ = (id) => document.getElementById(id);
  const form = $("create-form");
  const visitsByCode = new Map();

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error(data?.message || `Request failed with status ${res.status}`);
    return data;
  }

  const shortUrl = (code) => `${location.origin}/${code}`;

  function timeAgo(iso) {
    if (!iso) return "never";
    const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 10) return "just now";
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return new Date(iso).toLocaleDateString();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied to clipboard");
    } catch {
      toast(text);
    }
  }

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    for (const c of [].concat(children)) node.append(c);
    return node;
  }

  function renderItem(link, stats) {
    const visits = el("span", { className: "visits", title: "Visits" }, `${stats.visits} ${stats.visits === 1 ? "visit" : "visits"}`);
    const previous = visitsByCode.get(link.code);
    if (previous !== undefined && previous !== stats.visits) visits.classList.add("bump");
    visitsByCode.set(link.code, stats.visits);

    const open = el("a", { className: "short", href: shortUrl(link.code), target: "_blank", rel: "noopener", textContent: `/${link.code}` });
    open.addEventListener("click", () => setTimeout(refresh, 400));

    const copyBtn = el("button", { className: "ghost", type: "button", textContent: "Copy" });
    copyBtn.addEventListener("click", () => copy(shortUrl(link.code)));

    const delBtn = el("button", { className: "ghost danger", type: "button", textContent: "Delete" });
    delBtn.setAttribute("aria-label", `Delete /${link.code}`);
    delBtn.addEventListener("click", async () => {
      if (!confirm(`Delete /${link.code}?`)) return;
      try {
        await api("DELETE", `/links/${encodeURIComponent(link.code)}`);
        toast(`Deleted /${link.code}`);
        refresh();
      } catch (e) {
        toast(e.message);
      }
    });

    return el("li", {}, [
      el("div", { className: "left" }, [
        el("div", {}, [open]),
        el("div", { className: "target", title: link.url, textContent: link.url }),
        el("div", { className: "meta" }, [
          visits,
          el("span", { textContent: `Last visit: ${timeAgo(stats.last_visit_at)}` }),
          el("span", { textContent: `Created: ${timeAgo(link.created_at)}` }),
        ]),
      ]),
      el("div", { className: "actions" }, [copyBtn, delBtn]),
    ]);
  }

  async function refresh() {
    try {
      const links = await api("GET", "/links");
      const stats = await Promise.all(
        links.map((l) => api("GET", `/links/${encodeURIComponent(l.code)}/stats`).catch(() => ({ visits: 0, last_visit_at: null })))
      );
      $("links").replaceChildren(...links.map((l, i) => renderItem(l, stats[i])));
      $("empty").hidden = links.length > 0;
      $("count").textContent = links.length ? `${links.length} ${links.length === 1 ? "link" : "links"}` : "";
    } catch (e) {
      $("count").textContent = "Could not load links";
    }
  }

  async function status() {
    try {
      const h = await api("GET", "/health");
      $("health-dot").classList.add("ok");
      $("health").textContent = `Healthy · up ${h.uptime_seconds}s`;
    } catch {
      $("health-dot").classList.remove("ok");
      $("health").textContent = "Service unreachable";
    }
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const url = $("url").value.trim();
    const code = $("code").value.trim();
    const btn = $("submit");
    $("error").hidden = true;
    btn.disabled = true;
    try {
      const link = await api("POST", "/links", code ? { url, code } : { url });
      const a = $("result-link");
      a.href = shortUrl(link.code);
      a.textContent = shortUrl(link.code);
      $("result-target").textContent = link.url;
      $("result").hidden = false;
      $("result").style.animation = "none";
      $("result").offsetHeight;
      $("result").style.animation = "";
      form.reset();
      refresh();
    } catch (e) {
      $("error").textContent = e.message;
      $("error").hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  $("result-copy").addEventListener("click", () => copy($("result-link").href));
  $("result-link").addEventListener("click", () => setTimeout(refresh, 400));

  api("GET", "/version").then((v) => {
    $("version").textContent = `v${v.version} · ${String(v.commit).slice(0, 7)}`;
  }).catch(() => {});

  refresh();
  status();
  setInterval(() => {
    if (document.visibilityState === "visible") {
      refresh();
      status();
    }
  }, REFRESH_MS);
})();
</script>
</body>
</html>
